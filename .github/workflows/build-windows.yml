name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        default: ''
      upload_release:
        description: 'Upload to GitHub Release'
        required: false
        default: 'true'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma clients
        run: |
          pnpm prisma generate --schema=prisma/auth/schema.prisma
          pnpm prisma generate --schema=prisma/data/schema.prisma

      - name: Build Nuxt + prepare Tauri runtime
        run: pnpm tauri:prepare
        env:
          PRISMA_ENGINES_MIRROR: 'https://binaries.prisma.sh'

      - name: Build Tauri (MSI + NSIS)
        run: pnpm tauri build --features desktop-production --config src-tauri/tauri.prod.conf.json --bundles msi,nsis
        env:
          PRISMA_ENGINES_MIRROR: 'https://binaries.prisma.sh'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pnltracker-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pnltracker-desktop.exe

      - name: Upload to GitHub Release
        if: github.event.inputs.upload_release == 'true' && github.event.inputs.version != ''
        run: |
          gh release upload ${{ github.event.inputs.version }} `
            src-tauri/target/release/bundle/msi/*.msi `
            src-tauri/target/release/bundle/nsis/*.exe `
            --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
