# Docker Compose for Development
# Runs only PostgreSQL for local development
# The Nuxt app runs on the host machine (npm run dev)

services:
  postgres:
    image: postgres:16-alpine
    container_name: pnltracker-postgres-dev
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pnltracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data_dev:
    name: pnltracker_pg_data_dev
    driver: local
