<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PnlTracker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
	background: #0f0f14;
	color: #e0e0e0;
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	height: 100vh;
	overflow: hidden;
}
.container {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 24px;
}
.logo {
	width: 200px;
	height: 60px;
}
.spinner {
	width: 32px;
	height: 32px;
	border: 2px solid rgba(255, 255, 255, 0.06);
	border-top-color: rgba(255, 255, 255, 0.35);
	border-radius: 50%;
	animation: spin 0.9s linear infinite;
}
@keyframes spin {
	to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
	<img src="img/logo-dark.svg" alt="PnlTracker" class="logo" />
	<div class="spinner"></div>
</div>
</body>
</html>
