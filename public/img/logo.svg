<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="56" viewBox="0 0 200 56" xmlns="http://www.w3.org/2000/svg">
  <!-- Candlestick icon -->
  <!-- Candle 1 (bearish, red) -->
  <line x1="14" y1="8" x2="14" y2="14" stroke="#F44336" stroke-width="1.5"/>
  <rect x="10" y="14" width="8" height="14" rx="1" fill="#F44336"/>
  <line x1="14" y1="28" x2="14" y2="36" stroke="#F44336" stroke-width="1.5"/>
  <!-- Candle 2 (bullish, green) -->
  <line x1="28" y1="18" x2="28" y2="24" stroke="#4CAF50" stroke-width="1.5"/>
  <rect x="24" y="24" width="8" height="16" rx="1" fill="#4CAF50"/>
  <line x1="28" y1="40" x2="28" y2="46" stroke="#4CAF50" stroke-width="1.5"/>
  <!-- Candle 3 (bearish, red) -->
  <line x1="42" y1="10" x2="42" y2="16" stroke="#F44336" stroke-width="1.5"/>
  <rect x="38" y="16" width="8" height="12" rx="1" fill="#F44336"/>
  <line x1="42" y1="28" x2="42" y2="34" stroke="#F44336" stroke-width="1.5"/>
  <!-- Candle 4 (bullish, green) -->
  <line x1="56" y1="12" x2="56" y2="20" stroke="#4CAF50" stroke-width="1.5"/>
  <rect x="52" y="20" width="8" height="18" rx="1" fill="#4CAF50"/>
  <line x1="56" y1="38" x2="56" y2="44" stroke="#4CAF50" stroke-width="1.5"/>

  <!-- Text: Pnl -->
  <text x="74" y="29" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#1a202c">Pnl</text>
  <!-- Text: Tracker -->
  <text x="74" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#4CAF50">Tracker</text>
</svg>
