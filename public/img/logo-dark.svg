<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
	<!-- Background rounded square behind icon -->
	<rect x="4" y="8" width="44" height="44" rx="10" fill="#60a5fa" fill-opacity="0.15"/>
	<!-- Icon: stylized candlestick chart forming an upward trend -->
	<g transform="translate(8, 12)">
		<!-- Candle 1 (red/loss) -->
		<rect x="0" y="18" width="4" height="14" rx="1" fill="#f87171"/>
		<line x1="2" y1="10" x2="2" y2="18" stroke="#f87171" stroke-width="1.5"/>
		<line x1="2" y1="32" x2="2" y2="38" stroke="#f87171" stroke-width="1.5"/>
		<!-- Candle 2 (green/profit, taller) -->
		<rect x="10" y="12" width="4" height="20" rx="1" fill="#4ade80"/>
		<line x1="12" y1="6" x2="12" y2="12" stroke="#4ade80" stroke-width="1.5"/>
		<line x1="12" y1="32" x2="12" y2="40" stroke="#4ade80" stroke-width="1.5"/>
		<!-- Candle 3 (green/profit, tallest) -->
		<rect x="20" y="6" width="4" height="22" rx="1" fill="#4ade80"/>
		<line x1="22" y1="2" x2="22" y2="6" stroke="#4ade80" stroke-width="1.5"/>
		<line x1="22" y1="28" x2="22" y2="36" stroke="#4ade80" stroke-width="1.5"/>
		<!-- Trend arrow -->
		<path d="M2 34 L12 22 L22 12 L30 8" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
		<polygon points="28,6 34,8 30,12" fill="#60a5fa"/>
	</g>
	<!-- Text -->
	<text x="56" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
		Pnl<tspan fill="#4ade80">Tracker</tspan>
	</text>
</svg>
