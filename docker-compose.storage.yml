services:
  storage-server:
    build:
      context: ./tradeJourney-private-tools/storage-server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: ${STORAGE_SERVER_PORT:-5000}
      DEBUG: ${STORAGE_SERVER_DEBUG:-false}
    ports:
      - "${STORAGE_SERVER_PORT:-5000}:${STORAGE_SERVER_PORT:-5000}"
    command: uv run python app.py
    volumes:
      - storage_data:/app/storage

  storage-cleanup:
    build:
      context: ./tradeJourney-private-tools/storage-server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      STORAGE_DIR: /app/storage
    command: >
      sh -c "while true; do uv run python cleanup.py ${CLEANUP_DAYS_OLD:-2}; sleep 3600; done"
    volumes:
      - storage_data:/app/storage
    depends_on:
      - storage-server

volumes:
  storage_data:
    name: tradejourney_storage_data
    driver: local
